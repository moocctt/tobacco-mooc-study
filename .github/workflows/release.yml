name: Release

# 合进 main 之后：跑测试 → 从提交记录生成 CHANGELOG → 升版本号 → 打 tag → 建 Release。
# 没有需要发布的提交时什么都不做。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # 发布提交本身不再触发新一轮发布
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 发布前跑一遍测试
        run: |
          npm run check
          npm run test:unit

      - name: 生成 CHANGELOG 并升版本
        id: bump
        run: |
          node scripts/changelog.js --write --notes "$RUNNER_TEMP/notes.md"
          if git diff --quiet --exit-code; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "没有需要发布的提交"
          else
            version=$(node -p "require('./package.json').version")
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "本次发布 v$version"
          fi

      - name: 提交、打 tag、推送
        if: steps.bump.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: 建 GitHub Release
        if: steps.bump.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
