<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">学时上报链路：创建学习日志并回溯 createTime，服务端只比日志年龄，逐轮入账直到小节完成</title>
  <desc id="flowDesc">四步链路。第一步 start-progress 创建学习日志，关键在 createTime 可回溯；第二步服务端只校验 studyTime 不超过日志年龄；第三步 video-progress 单轮入账不超过 90 秒；第四步剩余时长归零，finishStatus 变为 2。</desc>

  <rect width="1200" height="340" rx="24" fill="#0B1118"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3E5670"/>
    </marker>
  </defs>

  <text x="56" y="48" font-size="19" fill="#A8B6C8"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">每轮上报：创建日志 → 服务端校验 → 时长入账 → 小节完成</text>

  <!-- 步骤 1 -->
  <g>
    <rect x="56" y="88" width="246" height="140" rx="10" fill="#111A24" stroke="#22303F"/>
    <text x="76" y="122" font-size="20" fill="#E8EEF6"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">start-progress</text>
    <text x="76" y="160" font-size="20" fill="#A8B6C8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">创建学习日志</text>
    <text x="76" y="198" font-size="18" fill="#F2A66B"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">createTime 可回溯</text>
  </g>

  <!-- 步骤 2 -->
  <g>
    <rect x="336" y="88" width="246" height="140" rx="10" fill="#111A24" stroke="#22303F"/>
    <text x="356" y="122" font-size="20" fill="#E8EEF6"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">服务端校验</text>
    <text x="356" y="160" font-size="20" fill="#A8B6C8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">只比日志年龄</text>
    <text x="356" y="198" font-size="18" fill="#6FD39B"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">studyTime ≤ 年龄</text>
  </g>

  <!-- 步骤 3 -->
  <g>
    <rect x="616" y="88" width="246" height="140" rx="10" fill="#111A24" stroke="#22303F"/>
    <text x="636" y="122" font-size="20" fill="#E8EEF6"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">video-progress</text>
    <text x="636" y="160" font-size="20" fill="#A8B6C8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">学习时长入账</text>
    <text x="636" y="198" font-size="18" fill="#F2A66B"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">单轮 ≤ 90s</text>
  </g>

  <!-- 步骤 4 -->
  <g>
    <rect x="896" y="88" width="246" height="140" rx="10" fill="#111A24" stroke="#22303F"/>
    <text x="916" y="122" font-size="20" fill="#E8EEF6"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">finishStatus=2</text>
    <text x="916" y="160" font-size="20" fill="#A8B6C8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">小节完成</text>
    <text x="916" y="198" font-size="18" fill="#6FD39B"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">剩余时长归零</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#3E5670" stroke-width="2" marker-end="url(#arw)">
    <line x1="304" y1="158" x2="328" y2="158"/>
    <line x1="584" y1="158" x2="608" y2="158"/>
    <line x1="864" y1="158" x2="888" y2="158"/>
  </g>

  <g font-size="19" fill="#7A8A9E"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="272">每条日志提交一次即失效（40909），所以每轮都要重新 start-progress。</text>
    <text x="56" y="304">关联课程（sectionType=10）先刷完子课程，再用 course-section-progress 结算父记录。</text>
  </g>
</svg>
