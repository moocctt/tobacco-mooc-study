<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="paceTitle paceDesc">
  <title id="paceTitle">两种模式的节奏对比：快速刷课约 5 分钟拿满 240 分钟学时，无人值守上报秒数等于真实流逝</title>
  <desc id="paceDesc">以一门 4 学时（240 分钟）的课为例。橙线几近垂直，表示实际只过了约 5 分钟就累计满 240 分钟学时；绿线为 45 度斜线，表示无人值守模式下学时与真实时间 1:1 增长。</desc>

  <rect width="1200" height="360" rx="24" fill="#0B1118"/>

  <text x="56" y="44" font-size="19" fill="#7A8A9E"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">假设一门 4 学时（240 分钟）的课 · 横轴 = 实际经过的时间 · 纵轴 = 已入账学时</text>

  <!-- 坐标轴 -->
  <line x1="300" y1="76" x2="300" y2="260" stroke="#2C3B4D" stroke-width="1"/>
  <line x1="300" y1="260" x2="1100" y2="260" stroke="#2C3B4D" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7A8A9E">
    <text x="288" y="83" text-anchor="end">4h</text>
    <text x="288" y="175" text-anchor="end">2h</text>
    <text x="288" y="267" text-anchor="end">0</text>
    <text x="300" y="290" text-anchor="middle">0</text>
    <text x="500" y="290" text-anchor="middle">1h</text>
    <text x="700" y="290" text-anchor="middle">2h</text>
    <text x="900" y="290" text-anchor="middle">3h</text>
    <text x="1100" y="290" text-anchor="middle">4h</text>
  </g>

  <!-- 无人值守 1:1 -->
  <path d="M300 260 L1100 76" fill="none" stroke="#6FD39B" stroke-width="3" stroke-linecap="round"/>
  <!-- 快速刷课 -->
  <path d="M300 260 L318 76 H1100" fill="none" stroke="#F2A66B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="318" y1="104" x2="342" y2="104" stroke="#F2A66B" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="350" y="110" font-size="19" fill="#F2A66B"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">约 5 分钟拿满 240 分钟学时，之后全是空的</text>

  <!-- 图例 -->
  <rect x="56" y="318" width="14" height="14" rx="3" fill="#F2A66B"/>
  <text x="80" y="331" font-size="19" fill="#F2A66B"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">⚡ 快速刷课 —— 5 分钟换 240 分钟学时</text>

  <rect x="520" y="318" width="14" height="14" rx="3" fill="#6FD39B"/>
  <text x="544" y="331" font-size="19" fill="#6FD39B"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">▶ 无人值守 —— 上报秒数 == 真实流逝</text>
</svg>
